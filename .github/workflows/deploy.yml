name: Deploy application
on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        required: true
        options: [staging, prod]
      mode:
        description: Smoke testa dois deploys mínimos; application aplica migrações e web/worker
        type: choice
        required: true
        default: smoke
        options: [smoke, application]
      revision:
        description: SHA completo já aprovado na CI de main (vazio usa a revisão deste workflow)
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: aws-operations
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    environment: app-${{ inputs.environment }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      AWS_REGION: us-east-2
      DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
      DEPLOY_MODE: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require a main revision approved by CI
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ inputs.revision || github.sha }}
        run: |
          set -euo pipefail
          [[ "$REVISION" =~ ^[a-f0-9]{40}$ ]]
          git merge-base --is-ancestor "$REVISION" origin/main
          successes=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$REVISION&event=push&status=success" --jq '[.workflow_runs[] | select(.head_branch == "main")] | length')
          test "$successes" -gt 0
          git checkout --detach "$REVISION"
          echo "DEPLOY_SHA=$REVISION" >> "$GITHUB_ENV"
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-2
          allowed-account-ids: "413781344359"
      - uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - name: Build and publish immutable ARM image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ inputs.mode == 'smoke' && 'infra/deploy/Smoke.Dockerfile' || 'infra/deploy/Dockerfile' }}
          platforms: linux/arm64
          push: true
          tags: 413781344359.dkr.ecr.us-east-2.amazonaws.com/lazuli/${{ inputs.environment }}:${{ env.DEPLOY_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha,scope=${{ inputs.mode }}-arm64
          cache-to: type=gha,scope=${{ inputs.mode }}-arm64,mode=max
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install AWS Session Manager plugin
        if: inputs.mode == 'application'
        run: |
          curl --fail --silent --show-error --location https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_arm64/session-manager-plugin.deb -o "$RUNNER_TEMP/session-manager-plugin.deb"
          sudo dpkg -i "$RUNNER_TEMP/session-manager-plugin.deb"
      - name: Deploy and verify
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          node infra/deploy/run.mjs "$DEPLOY_MODE" "$DEPLOY_ENVIRONMENT" "413781344359.dkr.ecr.us-east-2.amazonaws.com/lazuli/$DEPLOY_ENVIRONMENT@$IMAGE_DIGEST"
          echo "Verified $DEPLOY_MODE on $DEPLOY_ENVIRONMENT: $DEPLOY_SHA ($IMAGE_DIGEST)" >> "$GITHUB_STEP_SUMMARY"
