name: Deployment image
on:
  pull_request:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "tooling/**"
      - "scripts/runtime*"
      - "scripts/turbo-env-check.mjs"
      - "infra/deploy/**"
      - ".dockerignore"
      - ".github/workflows/image-check.yml"
      - "pnpm-*.yaml"
      - "package.json"
permissions:
  contents: read
concurrency:
  group: image-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/deploy/Dockerfile
          platforms: linux/arm64
          push: false
          cache-from: type=gha,scope=application-arm64
          cache-to: type=gha,scope=application-arm64,mode=max
