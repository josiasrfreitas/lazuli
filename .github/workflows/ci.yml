name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Static checks
    runs-on: ubuntu-latest
    outputs:
      mutation-scope: ${{ steps.mutation-scope.outputs.selected }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Detect mutation scope
        id: mutation-scope
        if: github.event_name == 'pull_request'
        run: |
          selected=$(node scripts/mutate-changed.mjs --base origin/${{ github.base_ref }} --scope-only)
          echo "selected=$selected" >> "$GITHUB_OUTPUT"
      - name: Format
        run: pnpm format:check
      - name: Lint and typecheck
        run: pnpm exec turbo run lint lint:root duplication:check typecheck
      - name: Prospective test quality
        run: pnpm test:quality:changed --base origin/${{ github.base_ref || 'main' }}

  build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Build
        run: pnpm build

  quality:
    name: Quality gates
    if: always()
    needs: [checks, build]
    runs-on: ubuntu-latest
    steps:
      - name: Require static checks and build
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: test "$CHECKS_RESULT" = success && test "$BUILD_RESULT" = success

  tests:
    name: Complete test tiers
    needs: checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lazuli
          POSTGRES_PASSWORD: lazuli
          POSTGRES_DB: lazuli
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lazuli -d lazuli"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      mailpit:
        image: axllent/mailpit:v1.21
        ports: ["1025:1025", "8025:8025"]
    env:
      DATABASE_URL: postgresql://lazuli:lazuli@localhost:5432/lazuli?schema=public
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Apply migrations
        run: pnpm prisma:deploy
      - name: Check migration drift
        run: pnpm prisma:drift
      - name: Wait for Mailpit
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8025/api/v1/info >/dev/null && exit 0
            sleep 1
          done
          echo "Mailpit did not become ready in time"
          exit 1
      - name: Root unit checks
        run: pnpm exec turbo run test:scripts test:component-lines test:styles --force
      - name: Unit reports
        run: pnpm exec turbo run test --force
      - name: Integration reports
        run: pnpm exec turbo run test:integration --force --concurrency=1
      - name: Transport reports
        run: pnpm exec turbo run test:transport --force --concurrency=1
      - name: Slow-test report
        if: always()
        run: pnpm test:durations
      - name: Publish JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ github.run_id }}
          path: |
            apps/*/reports/junit/*.xml
            packages/*/reports/junit/*.xml
            tooling/*/reports/junit/*.xml
          if-no-files-found: error
      - name: Publish LCOV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lcov-${{ github.run_id }}
          path: |
            apps/*/coverage/*/lcov.info
            packages/*/coverage/*/lcov.info
            tooling/*/coverage/*/lcov.info
          if-no-files-found: error

  mutation:
    name: Changed-file mutation
    if: github.event_name == 'pull_request' && needs.checks.outputs.mutation-scope == 'true'
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Fingerprint mutation inputs
        id: mutation-inputs
        run: |
          fingerprint=$(node scripts/mutation-cache-key.mjs --base origin/${{ github.base_ref }})
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
      - name: Restore Stryker incremental reports
        id: stryker-incremental-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            apps/*/reports/stryker-incremental.json
            packages/*/reports/stryker-incremental.json
          key: stryker-v2-${{ runner.os }}-${{ steps.mutation-inputs.outputs.fingerprint }}-pr-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            stryker-v2-${{ runner.os }}-${{ steps.mutation-inputs.outputs.fingerprint }}-pr-${{ github.event.pull_request.number }}-
      - name: Mutate changed source
        run: pnpm mutate:changed --base origin/${{ github.base_ref }}
      - name: Save Stryker incremental reports
        if: ${{ !cancelled() && steps.stryker-incremental-cache.outcome == 'success' && hashFiles('apps/*/reports/stryker-incremental.json', 'packages/*/reports/stryker-incremental.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: |
            apps/*/reports/stryker-incremental.json
            packages/*/reports/stryker-incremental.json
          key: ${{ steps.stryker-incremental-cache.outputs.cache-primary-key }}
      - name: Publish mutation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-${{ github.run_id }}
          path: |
            apps/*/reports/mutation/**
            packages/*/reports/mutation/**
          if-no-files-found: warn
