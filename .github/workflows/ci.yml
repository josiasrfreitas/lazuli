name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Verificações estáticas
    runs-on: ubuntu-latest
    steps:
      - name: Preparar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Instalar dependências e restaurar cache
        uses: ./.github/actions/setup
        id: setup
      - name: Verificar formatação
        run: pnpm format:check
      - name: Verificar lint
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm exec turbo run lint lint:root --continue=dependencies-successful
      - name: Verificar tipos
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm exec turbo run typecheck --continue=dependencies-successful
      - name: Verificar duplicação de código
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm exec turbo run duplication:check --continue=dependencies-successful
      - name: Verificar limite de tamanho dos componentes
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm exec turbo run test:component-lines --continue=dependencies-successful
      - name: Verificar qualidade dos testes alterados
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm test:quality:changed --base origin/${{ github.base_ref || 'main' }}

  build:
    name: Build de produção
    runs-on: ubuntu-latest
    steps:
      - name: Preparar código
        uses: actions/checkout@v4
      - name: Instalar dependências e restaurar cache
        uses: ./.github/actions/setup
      - name: Compilar aplicações e pacotes
        run: pnpm exec turbo run build --continue=dependencies-successful

  unit:
    name: Testes unitários, scripts e estilos
    runs-on: ubuntu-latest
    steps:
      - name: Preparar código
        uses: actions/checkout@v4
      - name: Instalar dependências e restaurar cache
        uses: ./.github/actions/setup
        id: setup
      - name: Executar testes unitários dos pacotes
        id: unit
        run: pnpm exec turbo run test --force --continue=dependencies-successful
      - name: Executar testes dos scripts
        id: scripts
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm exec turbo run test:scripts --force --continue=dependencies-successful
      - name: Executar testes dos estilos
        id: styles
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm exec turbo run test:styles --force --continue=dependencies-successful
      - name: Resumir preparação e execução dos testes
        if: always()
        env:
          SETUP: ${{ steps.setup.outcome }}
          UNIT: ${{ steps.unit.outcome }}
          SCRIPTS: ${{ steps.scripts.outcome }}
          STYLES: ${{ steps.styles.outcome }}
        run: |
          echo "Preparação: $SETUP; unitários: $UNIT; scripts: $SCRIPTS; estilos: $STYLES" >> "$GITHUB_STEP_SUMMARY"
          if [ "$UNIT" != success ] || [ "$SCRIPTS" != success ] || [ "$STYLES" != success ]; then
            echo "Validação incompleta: preparação ou tarefa falhou/foi impedida. Consulte os logs das etapas; os relatórios podem estar parciais." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Identificar testes mais lentos
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && hashFiles('**/reports/junit/*.xml') != '' }}
        run: pnpm test:durations
      - name: Publicar resultados dos testes (JUnit)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ github.job }}-${{ github.run_id }}
          path: |
            apps/*/reports/junit/*.xml
            packages/*/reports/junit/*.xml
            tooling/*/reports/junit/*.xml
          if-no-files-found: ${{ steps.unit.outcome == 'success' && 'error' || 'ignore' }}
      - name: Publicar cobertura dos testes (LCOV)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lcov-${{ github.job }}-${{ github.run_id }}
          path: |
            apps/*/coverage/*/lcov.info
            packages/*/coverage/*/lcov.info
            tooling/*/coverage/*/lcov.info
          if-no-files-found: ${{ steps.unit.outcome == 'success' && 'error' || 'ignore' }}

  infrastructure:
    name: Testes de integração e transporte
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lazuli
          POSTGRES_PASSWORD: lazuli
          POSTGRES_DB: lazuli
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lazuli -d lazuli"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      mailpit:
        image: axllent/mailpit:v1.21
        ports: ["1025:1025", "8025:8025"]
    env:
      DATABASE_URL: postgresql://lazuli:lazuli@localhost:5432/lazuli?schema=public
    steps:
      - name: Preparar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Instalar dependências e restaurar cache
        uses: ./.github/actions/setup
        id: setup
      - name: Preparar banco com as migrations
        id: migrations
        run: pnpm prisma:deploy
      - name: Verificar consistência do schema do banco
        id: drift
        run: pnpm prisma:drift
      - name: Aguardar serviço de email (Mailpit)
        id: mailpit
        if: ${{ !cancelled() && steps.migrations.outcome == 'success' }}
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8025/api/v1/info >/dev/null && exit 0
            sleep 1
          done
          echo "Mailpit did not become ready in time"
          exit 1
      - name: Executar testes de integração
        id: integration
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && steps.migrations.outcome == 'success' && steps.drift.outcome == 'success' && steps.mailpit.outcome == 'success' }}
        run: pnpm exec turbo run test:integration --force --concurrency=1 --continue=dependencies-successful
      - name: Executar testes de transporte
        id: transport
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && steps.migrations.outcome == 'success' && steps.drift.outcome == 'success' && steps.mailpit.outcome == 'success' }}
        run: pnpm exec turbo run test:transport --force --concurrency=1 --continue=dependencies-successful
      - name: Resumir preparação e execução dos testes
        if: always()
        env:
          SETUP: ${{ steps.setup.outcome }}
          MIGRATIONS: ${{ steps.migrations.outcome }}
          DRIFT: ${{ steps.drift.outcome }}
          MAILPIT: ${{ steps.mailpit.outcome }}
          INTEGRATION: ${{ steps.integration.outcome }}
          TRANSPORT: ${{ steps.transport.outcome }}
        run: |
          echo "Preparação: instalação=$SETUP, migrations=$MIGRATIONS, schema=$DRIFT, Mailpit=$MAILPIT" >> "$GITHUB_STEP_SUMMARY"
          echo "Integração: $INTEGRATION; transporte: $TRANSPORT" >> "$GITHUB_STEP_SUMMARY"
          if [ "$INTEGRATION" != success ] || [ "$TRANSPORT" != success ]; then
            echo "Validação incompleta: preparação ou tarefa falhou/foi impedida. Consulte os logs das etapas; os relatórios podem estar parciais." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Identificar testes mais lentos
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && hashFiles('**/reports/junit/*.xml') != '' }}
        run: pnpm test:durations
      - name: Publicar resultados dos testes (JUnit)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ github.job }}-${{ github.run_id }}
          path: |
            apps/*/reports/junit/*.xml
            packages/*/reports/junit/*.xml
            tooling/*/reports/junit/*.xml
          if-no-files-found: ${{ steps.integration.outcome == 'success' && steps.transport.outcome == 'success' && 'error' || 'ignore' }}
      - name: Publicar cobertura dos testes (LCOV)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lcov-${{ github.job }}-${{ github.run_id }}
          path: |
            apps/*/coverage/*/lcov.info
            packages/*/coverage/*/lcov.info
            tooling/*/coverage/*/lcov.info
          if-no-files-found: ${{ steps.integration.outcome == 'success' && steps.transport.outcome == 'success' && 'error' || 'ignore' }}

  quality:
    name: Quality gates
    if: always()
    needs: [checks, build, unit, infrastructure]
    runs-on: ubuntu-latest
    steps:
      - name: Consolidar resultados e exigir validação completa
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          node <<'JS'
          const jobs = JSON.parse(process.env.NEEDS);
          const summary = ['| Validação | Resultado |', '| --- | --- |'];
          const names = { checks: 'Verificações estáticas', build: 'Build de produção', unit: 'Unitários, scripts e estilos', infrastructure: 'Integração e transporte' };
          let passed = true;
          for (const name of ['checks', 'build', 'unit', 'infrastructure']) {
            const job = jobs[name];
            const valid = job.result === 'success';
            const label = valid ? 'Sucesso' : job.result === 'failure' ? 'Falha' : 'Incompleta / impedida';
            summary.push(`| ${names[name]} | ${label} |`);
            passed &&= valid;
          }
          require('node:fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary.join('\n') + '\n');
          if (!passed) process.exitCode = 1;
          JS
