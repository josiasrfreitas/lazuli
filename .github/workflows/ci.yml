name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation-scope:
    name: Mutation scope
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      selected: ${{ steps.detect.outputs.selected }}
      matrix: ${{ steps.detect.outputs.matrix }}
      fingerprint: ${{ steps.detect.outputs.fingerprint }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Detect changed mutation packages
        id: detect
        run: |
          base="origin/${{ github.base_ref }}"
          selected=$(node scripts/mutate-changed.mjs --base "$base" --scope-only)
          matrix=$(node scripts/mutate-changed.mjs --base "$base" --matrix-only)
          fingerprint=$(node scripts/mutation-cache-key.mjs --base "$base")
          echo "selected=$selected" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

  checks:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Format
        run: pnpm format:check
      - name: Lint and typecheck
        run: pnpm exec turbo run lint lint:root duplication:check typecheck
      - name: Prospective test quality
        run: pnpm test:quality:changed --base origin/${{ github.base_ref || 'main' }}

  build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Build
        run: pnpm build

  quality:
    name: Quality gates
    if: always()
    needs: [checks, build]
    runs-on: ubuntu-latest
    steps:
      - name: Require static checks and build
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: test "$CHECKS_RESULT" = success && test "$BUILD_RESULT" = success

  tests:
    name: Complete test tiers
    needs: checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lazuli
          POSTGRES_PASSWORD: lazuli
          POSTGRES_DB: lazuli
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lazuli -d lazuli"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      mailpit:
        image: axllent/mailpit:v1.21
        ports: ["1025:1025", "8025:8025"]
    env:
      DATABASE_URL: postgresql://lazuli:lazuli@localhost:5432/lazuli?schema=public
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Apply migrations
        run: pnpm prisma:deploy
      - name: Check migration drift
        run: pnpm prisma:drift
      - name: Wait for Mailpit
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8025/api/v1/info >/dev/null && exit 0
            sleep 1
          done
          echo "Mailpit did not become ready in time"
          exit 1
      - name: Root unit checks
        run: pnpm exec turbo run test:scripts test:component-lines test:styles --force
      - name: Unit reports
        run: pnpm exec turbo run test --force
      - name: Integration reports
        run: pnpm exec turbo run test:integration --force --concurrency=1
      - name: Transport reports
        run: pnpm exec turbo run test:transport --force --concurrency=1
      - name: Slow-test report
        if: always()
        run: pnpm test:durations
      - name: Publish JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ github.run_id }}
          path: |
            apps/*/reports/junit/*.xml
            packages/*/reports/junit/*.xml
            tooling/*/reports/junit/*.xml
          if-no-files-found: error
      - name: Publish LCOV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lcov-${{ github.run_id }}
          path: |
            apps/*/coverage/*/lcov.info
            packages/*/coverage/*/lcov.info
            tooling/*/coverage/*/lcov.info
          if-no-files-found: error

  mutation-packages:
    name: Mutate ${{ matrix.packageDirectory }}
    if: github.event_name == 'pull_request' && needs.mutation-scope.outputs.selected == 'true'
    needs: mutation-scope
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.mutation-scope.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          turbo-cache-scope: mutation-${{ matrix.cacheScope }}
      - name: Restore package Stryker incremental report
        id: stryker-incremental-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ matrix.packageDirectory }}/reports/stryker-incremental.json
          key: stryker-v3-${{ runner.os }}-${{ needs.mutation-scope.outputs.fingerprint }}-pr-${{ github.event.pull_request.number }}-${{ matrix.cacheScope }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            stryker-v3-${{ runner.os }}-${{ needs.mutation-scope.outputs.fingerprint }}-pr-${{ github.event.pull_request.number }}-${{ matrix.cacheScope }}-
      - name: Mutate changed package
        env:
          MUTATION_PACKAGE_DIRECTORY: ${{ matrix.packageDirectory }}
        run: pnpm mutate:changed --base origin/${{ github.base_ref }} --package "$MUTATION_PACKAGE_DIRECTORY"
      - name: Save package Stryker incremental report
        if: ${{ !cancelled() && steps.stryker-incremental-cache.outcome == 'success' && hashFiles(format('{0}/reports/stryker-incremental.json', matrix.packageDirectory)) != '' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ matrix.packageDirectory }}/reports/stryker-incremental.json
          key: ${{ steps.stryker-incremental-cache.outputs.cache-primary-key }}
      - name: Publish package mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-${{ github.run_id }}-${{ matrix.cacheScope }}
          path: ${{ matrix.packageDirectory }}/reports/mutation/**
          if-no-files-found: warn

  mutation:
    name: Changed-file mutation
    if: always() && github.event_name == 'pull_request' && needs.mutation-scope.outputs.selected == 'true'
    needs: [mutation-scope, mutation-packages]
    runs-on: ubuntu-latest
    steps:
      - name: Download package mutation reports
        uses: actions/download-artifact@v4
        with:
          pattern: mutation-${{ github.run_id }}-*
          path: mutation-reports
      - name: Publish combined mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-${{ github.run_id }}
          path: mutation-reports/**
          if-no-files-found: warn
      - name: Require all package mutation checks to pass
        if: always()
        env:
          PACKAGE_MUTATION_RESULT: ${{ needs.mutation-packages.result }}
        run: test "$PACKAGE_MUTATION_RESULT" = success
