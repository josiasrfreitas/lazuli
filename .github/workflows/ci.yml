# Minimum CI gates for Lazuli.
#
# Every job here is a blocking gate on PRs to main and pushes to main. E2E runs separately
# (e2e.yml), not here.
#
# This workflow has no deploy step, Sentry upload, or coverage gate.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A newer push to the same ref cancels in-flight runs for that ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Format, lint, typecheck, unit tests, and build — none of these need a database.
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  # Three-tier tests: quality runs unit; this job runs integration + transport against Postgres 16.
  # DB integration tests + Prisma migrate/drift check against a real Postgres 16,
  # matching the accepted PostgreSQL 16 engine and the Docker Compose image.
  database:
    name: Database gates
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lazuli
          POSTGRES_PASSWORD: lazuli
          POSTGRES_DB: lazuli
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lazuli -d lazuli"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      # Mailpit backs the SMTP email delivery integration test (test/mailpit-email.integration.test.ts).
      # Ports match docker-compose.yml (SMTP 1025, UI/API 8025).
      mailpit:
        image: axllent/mailpit:v1.21
        ports:
          - 1025:1025
          - 8025:8025
    env:
      DATABASE_URL: postgresql://lazuli:lazuli@localhost:5432/lazuli?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      # Applies committed migrations to the fresh PG16 service.
      - name: Prisma migrate (deploy)
        run: pnpm prisma:deploy

      # Fails if schema.prisma has changes the committed migrations don't capture.
      - name: Prisma drift check
        run: pnpm prisma:drift

      # Mailpit has no health check, so poll its API before tests that depend on it.
      - name: Wait for Mailpit
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8025/api/v1/info > /dev/null; then
              echo "Mailpit ready"
              exit 0
            fi
            sleep 1
          done
          echo "Mailpit did not become ready in time"
          exit 1

      - name: Integration tests
        run: pnpm test:integration

      - name: Transport tests
        run: pnpm test:transport
