# Shared setup for every CI job: pnpm + Node + a frozen install + Turbo cache.
# Keeps the workflow jobs DRY.
name: Setup workspace
description: Install pnpm, Node, project dependencies, and restore the Turborepo cache.

inputs:
  turbo-cache-scope:
    description: Optional cache scope for matrix jobs.
    required: false

runs:
  using: composite
  steps:
    # Version comes from package.json `packageManager` (pnpm@11.6.0).
    - name: Install pnpm
      uses: pnpm/action-setup@v4

    - name: Install Node
      uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: pnpm

    # Restores Turborepo's local cache so unchanged packages skip rework.
    - name: Restore Turbo cache
      uses: actions/cache@v4
      with:
        path: .turbo
        key: turbo-v2-${{ runner.os }}-${{ inputs.turbo-cache-scope || github.job }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          turbo-v2-${{ runner.os }}-${{ inputs.turbo-cache-scope || github.job }}-

    # `postinstall` runs `prisma generate`, so the client is ready after this step.
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
