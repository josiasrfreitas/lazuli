</g><text x="740" y="329" font-family="Helvetica Neue, Arial, sans-serif" font-size="22" fill="#0f1e3d" letter-spacing="0">Selo completo: a partir de 48 px.</text><g transform="translate(668 401) scale(0.32)"><g xmlns="http://www.w3.org/2000/svg" fill="none" stroke="#d8ad4a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
