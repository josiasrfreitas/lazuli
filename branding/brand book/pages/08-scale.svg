</g><text x="740" y="428" font-family="Helvetica Neue, Arial, sans-serif" font-size="22" fill="#0f1e3d" letter-spacing="0">Selo pequeno: 32 px, com ajuste óptico.</text><text x="657" y="526" font-family="Helvetica Neue, Arial, sans-serif" font-size="21" fill="#52627c" letter-spacing="0">Assinatura vertical: largura mínima de 120 px.</text><text x="657" y="562" font-family="Helvetica Neue, Arial, sans-serif" font-size="21" fill="#52627c" letter-spacing="0">Horizontal: 200 px. Letreiro isolado: 100 px.</text><text x="657" y="598" font-family="Helvetica Neue, Arial, sans-serif" font-size="21" fill="#52627c" letter-spacing="0">Abaixo de 32 px, usar um suporte maior.</text><text x="657" y="634" font-family="Helvetica Neue, Arial, sans-serif" font-size="21" fill="#52627c" letter-spacing="0"></text><text x="657" y="670" font-family="Helvetica Neue, Arial, sans-serif" font-size="21" fill="#52627c" letter-spacing="0">Na impressão, começar com selo de 8 mm e</text><text x="657" y="706" font-family="Helvetica Neue, Arial, sans-serif" font-size="21" fill="#52627c" letter-spacing="0">confirmar a definição em uma prova física.</text><text x="72" y="793" font-family="Helvetica Neue, Arial, sans-serif" font-size="18" fill="#52627c" letter-spacing="0">A versão pequena reforça o traço e elimina uma linha interna; o selo principal mantém o desenho escolhido.</text><path d="M72 840H1368" stroke="#d8dfec" stroke-width="1"/><text x="72" y="872" font-family="Helvetica Neue, Arial, sans-serif" font-size="11" fill="#52627c" letter-spacing="1">PROTEÇÃO E REDUÇÃO</text><text x="1328" y="872" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" fill="#52627c" letter-spacing="0">08</text></svg>