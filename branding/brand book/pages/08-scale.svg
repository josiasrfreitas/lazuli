</g><text x="115" y="637" font-family="Helvetica Neue, Arial, sans-serif" font-size="20" fill="#0f1e3d" letter-spacing="0">Proteção mínima: 1/10 da altura do selo.</text><text x="115" y="675" font-family="Helvetica Neue, Arial, sans-serif" font-size="17" fill="#52627c" letter-spacing="0">Aplicar essa margem ao redor da assinatura inteira.</text><text x="657" y="245" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" fill="#52627c" letter-spacing="2">REDUÇÕES DIGITAIS</text><g transform="translate(660 293) scale(0.48)"><g xmlns="http://www.w3.org/2000/svg" fill="none" stroke="#d8ad4a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
