<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-label="O nome e a pedra"><title>O nome e a pedra</title><rect x="0" y="0" width="1440" height="900" rx="0" fill="#ffffff"/><text x="72" y="40" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" fill="#0f1e3d" letter-spacing="2">LAZULI / BRAND BOOK</text><text x="1090" y="40" font-family="Helvetica Neue, Arial, sans-serif" font-size="11" fill="#52627c" letter-spacing="1">IDENTIDADE 01 · OUT / 2026</text><path d="M72 62H1368" stroke="#d8dfec" stroke-width="1"/><text x="72" y="159" font-family="Georgia, Cambria, serif" font-size="54" fill="#0f1e3d" letter-spacing="0">Tudo começou com o azul.</text><rect x="72" y="223" width="430" height="545" rx="0" fill="#0f1e3d"/><rect x="117" y="286" width="340" height="400" rx="170.0" fill="none" stroke="#d8ad4a" stroke-width="1.5"/><text x="151" y="428.0" font-family="Georgia, Cambria, serif" font-size="67" fill="#e9edf6" letter-spacing="0">Lazuli</text><text x="147" y="509.0" font-family="Helvetica Neue, Arial, sans-serif" font-size="24" fill="#e9edf6" letter-spacing="0">Uma cor no início.</text><text x="147" y="543.8" font-family="Helvetica Neue, Arial, sans-serif" font-size="24" fill="#e9edf6" letter-spacing="0">Uma pedra no nome.</text><text x="563" y="266" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" fill="#52627c" letter-spacing="2">A ORIGEM REAL</text><text x="563" y="321" font-family="Georgia, Cambria, serif" font-size="29" fill="#0f1e3d" letter-spacing="0">O nome veio do azul usado no começo</text><text x="563" y="364" font-family="Georgia, Cambria, serif" font-size="29" fill="#0f1e3d" letter-spacing="0">do produto e da inspiração na pedra</text><text x="563" y="407" font-family="Georgia, Cambria, serif" font-size="29" fill="#0f1e3d" letter-spacing="0">lápis-lazúli. Essa é a primeira camada</text><text x="563" y="450" font-family="Georgia, Cambria, serif" font-size="29" fill="#0f1e3d" letter-spacing="0">da história do Lazuli.</text><text x="563" y="545" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" fill="#52627c" letter-spacing="2">O QUE A IDENTIDADE ACRESCENTA</text><text x="563" y="590" font-family="Helvetica Neue, Arial, sans-serif" font-size="23" fill="#52627c" letter-spacing="0">O azul guarda essa origem. O amarelo cria presença.</text><text x="563" y="625" font-family="Helvetica Neue, Arial, sans-serif" font-size="23" fill="#52627c" letter-spacing="0">A coruja aproxima a marca do conhecimento.</text><text x="563" y="660" font-family="Helvetica Neue, Arial, sans-serif" font-size="23" fill="#52627c" letter-spacing="0">O selo dá a esse encontro uma assinatura própria.</text><text x="563" y="695" font-family="Helvetica Neue, Arial, sans-serif" font-size="23" fill="#52627c" letter-spacing="0"></text><text x="563" y="730" font-family="Helvetica Neue, Arial, sans-serif" font-size="23" fill="#52627c" letter-spacing="0">A identidade cresce a partir de um motivo que já existia.</text><path d="M72 840H1368" stroke="#d8dfec" stroke-width="1"/><text x="72" y="872" font-family="Helvetica Neue, Arial, sans-serif" font-size="11" fill="#52627c" letter-spacing="1">O NOME E A PEDRA</text><text x="1328" y="872" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" fill="#52627c" letter-spacing="0">02</text></svg>