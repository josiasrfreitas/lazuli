<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-label="Tom de voz"><title>Tom de voz</title><rect x="0" y="0" width="1440" height="900" rx="0" fill="#ffffff"/><text x="72" y="40" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" fill="#0f1e3d" letter-spacing="2">LAZULI / BRAND BOOK</text><text x="1090" y="40" font-family="Helvetica Neue, Arial, sans-serif" font-size="11" fill="#52627c" letter-spacing="1">IDENTIDADE 01 · OUT / 2026</text><path d="M72 62H1368" stroke="#d8dfec" stroke-width="1"/><text x="72" y="155" font-family="Georgia, Cambria, serif" font-size="52" fill="#0f1e3d" letter-spacing="0">Uma voz clara, atenta e próxima.</text><text x="72" y="260" font-family="Georgia, Cambria, serif" font-size="41" fill="#0f1e3d" letter-spacing="0">Clara para orientar.</text><text x="72" y="322" font-family="Georgia, Cambria, serif" font-size="41" fill="#0f1e3d" letter-spacing="0">Atenta aos detalhes.</text><text x="72" y="384" font-family="Georgia, Cambria, serif" font-size="41" fill="#0f1e3d" letter-spacing="0">Próxima de quem trabalha.</text><text x="72" y="516" font-family="Helvetica Neue, Arial, sans-serif" font-size="22" fill="#52627c" letter-spacing="0">Falar com adultos, de pessoa para pessoa.</text><text x="72" y="555" font-family="Helvetica Neue, Arial, sans-serif" font-size="22" fill="#52627c" letter-spacing="0">Nomear a ação e explicar o próximo passo.</text><text x="72" y="594" font-family="Helvetica Neue, Arial, sans-serif" font-size="22" fill="#52627c" letter-spacing="0">Usar frases curtas e palavras conhecidas.</text><text x="72" y="633" font-family="Helvetica Neue, Arial, sans-serif" font-size="22" fill="#52627c" letter-spacing="0">Dar à escola o protagonismo da mensagem.</text><text x="760" y="259" font-family="Helvetica Neue, Arial, sans-serif" font-size="11" fill="#52627c" letter-spacing="1.5">CONFIRMAÇÃO</text><text x="760" y="306" font-family="Georgia, Cambria, serif" font-size="23" fill="#0f1e3d" letter-spacing="0">Presença registrada.</text><path d="M760 338H1368" stroke="#d8dfec" stroke-width="1"/><text x="760" y="389" font-family="Helvetica Neue, Arial, sans-serif" font-size="11" fill="#52627c" letter-spacing="1.5">ESTADO VAZIO</text><text x="760" y="436" font-family="Georgia, Cambria, serif" font-size="23" fill="#0f1e3d" letter-spacing="0">Ainda não há turmas neste período.</text><path d="M760 468H1368" stroke="#d8dfec" stroke-width="1"/><text x="760" y="519" font-family="Helvetica Neue, Arial, sans-serif" font-size="11" fill="#52627c" letter-spacing="1.5">ERRO RECUPERÁVEL</text><text x="760" y="566" font-family="Georgia, Cambria, serif" font-size="23" fill="#0f1e3d" letter-spacing="0">Não foi possível salvar. Tente novamente.</text><path d="M760 598H1368" stroke="#d8dfec" stroke-width="1"/><text x="760" y="649" font-family="Helvetica Neue, Arial, sans-serif" font-size="11" fill="#52627c" letter-spacing="1.5">APRESENTAÇÃO</text><text x="760" y="696" font-family="Georgia, Cambria, serif" font-size="23" fill="#0f1e3d" letter-spacing="0">Organização para o dia a dia da escola.</text><path d="M760 728H1368" stroke="#d8dfec" stroke-width="1"/><path d="M72 840H1368" stroke="#d8dfec" stroke-width="1"/><text x="72" y="872" font-family="Helvetica Neue, Arial, sans-serif" font-size="11" fill="#52627c" letter-spacing="1">TOM DE VOZ</text><text x="1328" y="872" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" fill="#52627c" letter-spacing="0">11</text></svg>