</g><text x="72" y="295" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" fill="#52627c" letter-spacing="2">SABEDORIA</text><text x="72" y="343.0" font-family="Georgia, Cambria, serif" font-size="30" fill="#0f1e3d" letter-spacing="0">Aprender, pensar,</text><text x="72" y="386.5" font-family="Georgia, Cambria, serif" font-size="30" fill="#0f1e3d" letter-spacing="0">fazer boas perguntas.</text><text x="72" y="460" font-family="Helvetica Neue, Arial, sans-serif" font-size="21" fill="#52627c" letter-spacing="0">A coruja traz uma associação</text><text x="72" y="493" font-family="Helvetica Neue, Arial, sans-serif" font-size="21" fill="#52627c" letter-spacing="0">com o saber e com quem ensina.</text><text x="72" y="526" font-family="Helvetica Neue, Arial, sans-serif" font-size="21" fill="#52627c" letter-spacing="0">Atena e a coruja aparecem juntas</text><text x="72" y="559" font-family="Helvetica Neue, Arial, sans-serif" font-size="21" fill="#52627c" letter-spacing="0">em moedas da antiga Atenas.</text><text x="1000" y="295" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" fill="#52627c" letter-spacing="2">ATENÇÃO</text><text x="1000" y="343.0" font-family="Georgia, Cambria, serif" font-size="30" fill="#0f1e3d" letter-spacing="0">Perceber.</text><text x="1000" y="386.5" font-family="Georgia, Cambria, serif" font-size="30" fill="#0f1e3d" letter-spacing="0">Acompanhar.</text><text x="1000" y="430.0" font-family="Georgia, Cambria, serif" font-size="30" fill="#0f1e3d" letter-spacing="0">Cuidar.</text><text x="1000" y="505" font-family="Helvetica Neue, Arial, sans-serif" font-size="21" fill="#52627c" letter-spacing="0">No Lazuli, essa atenção</text><text x="1000" y="538" font-family="Helvetica Neue, Arial, sans-serif" font-size="21" fill="#52627c" letter-spacing="0">se traduz em clareza</text><text x="1000" y="571" font-family="Helvetica Neue, Arial, sans-serif" font-size="21" fill="#52627c" letter-spacing="0">para a rotina da escola.</text><path d="M520 710H876" stroke="#d8ad4a" stroke-width="1"/><text x="450" y="760" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" fill="#0f1e3d" letter-spacing="1.2">SERENIDADE PARA GUIAR. PRESENÇA PARA APOIAR.</text><a href="https://www.britishmuseum.org/collection/object/C_1896-0703-233"><text x="72" y="824" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" fill="#52627c" letter-spacing="0">Referência: British Museum — moeda de Atenas com Atena e coruja</text></a><path d="M72 840H1368" stroke="#d8dfec" stroke-width="1"/><text x="72" y="872" font-family="Helvetica Neue, Arial, sans-serif" font-size="11" fill="#52627c" letter-spacing="1">A CORUJA E A EDUCAÇÃO</text><text x="1328" y="872" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" fill="#52627c" letter-spacing="0">03</text></svg>