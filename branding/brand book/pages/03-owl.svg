<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-label="A coruja e a educação"><title>A coruja e a educação</title><rect x="0" y="0" width="1440" height="900" rx="0" fill="#ffffff"/><text x="72" y="40" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" fill="#0f1e3d" letter-spacing="2">LAZULI / BRAND BOOK</text><text x="1090" y="40" font-family="Helvetica Neue, Arial, sans-serif" font-size="11" fill="#52627c" letter-spacing="1">IDENTIDADE 01 · OUT / 2026</text><path d="M72 62H1368" stroke="#d8dfec" stroke-width="1"/><text x="72" y="159" font-family="Georgia, Cambria, serif" font-size="54" fill="#0f1e3d" letter-spacing="0">Sabedoria com atenção.</text><g transform="translate(492 245) scale(4.1)"><g xmlns="http://www.w3.org/2000/svg" fill="none" stroke="#d8ad4a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="8" y="4" width="84" height="92" rx="42" />
        <path d="M27 29 26 17 42 27Q50 23 58 27L74 17 73 29C83 44 77 65 50 84C23 65 17 44 27 29Z" />
        <path d="M50 37C43 24 27 30 28 40C29 49 41 54 50 57C59 54 71 49 72 40C73 30 57 24 50 37Z" />
