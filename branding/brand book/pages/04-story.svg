<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-label="A história que queremos contar"><title>A história que queremos contar</title><rect x="0" y="0" width="1440" height="900" rx="0" fill="#12151d"/><text x="72" y="40" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" fill="#e9edf6" letter-spacing="2">LAZULI / BRAND BOOK</text><text x="1090" y="40" font-family="Helvetica Neue, Arial, sans-serif" font-size="11" fill="#b8c1d2" letter-spacing="1">IDENTIDADE 01 · OUT / 2026</text><path d="M72 62H1368" stroke="#2c3444" stroke-width="1"/><text x="72" y="165" font-family="Georgia, Cambria, serif" font-size="54" fill="#e9edf6" letter-spacing="0">A escola começa antes da aula.</text><text x="76" y="260" font-family="Helvetica Neue, Arial, sans-serif" font-size="25" fill="#e9edf6" letter-spacing="0">Antes da primeira palavra em outro idioma,</text><text x="76" y="300" font-family="Helvetica Neue, Arial, sans-serif" font-size="25" fill="#e9edf6" letter-spacing="0">há uma turma encontrando seu horário.</text><text x="76" y="340" font-family="Helvetica Neue, Arial, sans-serif" font-size="25" fill="#e9edf6" letter-spacing="0">Uma pessoa preparando o próximo encontro.</text><text x="76" y="380" font-family="Helvetica Neue, Arial, sans-serif" font-size="25" fill="#e9edf6" letter-spacing="0">Uma família esperando uma resposta.</text><text x="76" y="469" font-family="Helvetica Neue, Arial, sans-serif" font-size="24" fill="#b8c1d2" letter-spacing="0">O aprendizado acontece com gente.</text><text x="76" y="508" font-family="Helvetica Neue, Arial, sans-serif" font-size="24" fill="#b8c1d2" letter-spacing="0">E gente precisa de tempo, atenção e continuidade.</text><text x="76" y="547" font-family="Helvetica Neue, Arial, sans-serif" font-size="24" fill="#b8c1d2" letter-spacing="0"></text><text x="76" y="586" font-family="Helvetica Neue, Arial, sans-serif" font-size="24" fill="#b8c1d2" letter-spacing="0">Lazuli nasce para cuidar do que sustenta esse caminho:</text><text x="76" y="625" font-family="Helvetica Neue, Arial, sans-serif" font-size="24" fill="#b8c1d2" letter-spacing="0">ajudar a escola a organizar sua rotina e acompanhar</text><text x="76" y="664" font-family="Helvetica Neue, Arial, sans-serif" font-size="24" fill="#b8c1d2" letter-spacing="0">cada etapa com clareza.</text><rect x="925" y="230" width="443" height="530" rx="0" fill="#0f1e3d"/><g transform="translate(1093 278) scale(1.05)"><g xmlns="http://www.w3.org/2000/svg" fill="none" stroke="#d8ad4a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="8" y="4" width="84" height="92" rx="42" />
        <path d="M27 29 26 17 42 27Q50 23 58 27L74 17 73 29C83 44 77 65 50 84C23 65 17 44 27 29Z" />
        <path d="M50 37C43 24 27 30 28 40C29 49 41 54 50 57C59 54 71 49 72 40C73 30 57 24 50 37Z" />
        <path d="M26 49Q30 68 50 74Q70 68 74 49" /></g>
        <g xmlns="http://www.w3.org/2000/svg" fill="#d8ad4a"><circle cx="37" cy="39" r="3.2" /><circle cx="63" cy="39" r="3.2" /></g>
        <path xmlns="http://www.w3.org/2000/svg" fill="#e9edf6" d="M45 53H55L50 61Z" />
</g><text x="972" y="478" font-family="Georgia, Cambria, serif" font-size="43" fill="#e9edf6" letter-spacing="0">Cuidar</text><text x="972" y="537" font-family="Georgia, Cambria, serif" font-size="43" fill="#e9edf6" letter-spacing="0">da escola.</text><text x="972" y="596" font-family="Georgia, Cambria, serif" font-size="43" fill="#e9edf6" letter-spacing="0">Abrir espaço</text><text x="972" y="655" font-family="Georgia, Cambria, serif" font-size="43" fill="#e9edf6" letter-spacing="0">para aprender.</text><path d="M72 840H1368" stroke="#2c3444" stroke-width="1"/><text x="72" y="872" font-family="Helvetica Neue, Arial, sans-serif" font-size="11" fill="#b8c1d2" letter-spacing="1">A HISTÓRIA QUE QUEREMOS CONTAR</text><text x="1328" y="872" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" fill="#b8c1d2" letter-spacing="0">04</text></svg>