<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-label="Paleta e contraste"><title>Paleta e contraste</title><rect x="0" y="0" width="1440" height="900" rx="0" fill="#ffffff"/><text x="72" y="40" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" fill="#0f1e3d" letter-spacing="2">LAZULI / BRAND BOOK</text><text x="1090" y="40" font-family="Helvetica Neue, Arial, sans-serif" font-size="11" fill="#52627c" letter-spacing="1">IDENTIDADE 01 · OUT / 2026</text><path d="M72 62H1368" stroke="#d8dfec" stroke-width="1"/><text x="72" y="155" font-family="Georgia, Cambria, serif" font-size="47" fill="#0f1e3d" letter-spacing="0">O azul é a origem. O amarelo, o acento.</text><rect x="72" y="230" width="306" height="312" rx="0" fill="#0f1e3d"/><text x="96" y="433" font-family="Georgia, Cambria, serif" font-size="24" fill="#e9edf6" letter-spacing="0">Azul Lazuli</text><text x="96" y="480" font-family="Helvetica Neue, Arial, sans-serif" font-size="20" fill="#e9edf6" letter-spacing="0">#0F1E3D</text><text x="96" y="513" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" fill="#e9edf6" letter-spacing="0">RGB 15 · 30 · 61</text><rect x="402" y="230" width="306" height="312" rx="0" fill="#d8ad4a"/><text x="426" y="433" font-family="Georgia, Cambria, serif" font-size="24" fill="#0f1e3d" letter-spacing="0">Amarelo Lazuli</text><text x="426" y="480" font-family="Helvetica Neue, Arial, sans-serif" font-size="20" fill="#0f1e3d" letter-spacing="0">#D8AD4A</text><text x="426" y="513" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" fill="#0f1e3d" letter-spacing="0">RGB 216 · 173 · 74</text><rect x="732" y="230" width="306" height="312" rx="0" fill="#12151d"/><text x="756" y="433" font-family="Georgia, Cambria, serif" font-size="24" fill="#e9edf6" letter-spacing="0">Carvão</text><text x="756" y="480" font-family="Helvetica Neue, Arial, sans-serif" font-size="20" fill="#e9edf6" letter-spacing="0">#12151D</text><text x="756" y="513" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" fill="#e9edf6" letter-spacing="0">RGB 18 · 21 · 29</text><rect x="1062" y="230" width="306" height="312" rx="0" fill="#ffffff" stroke="#d8dfec"/><text x="1086" y="433" font-family="Georgia, Cambria, serif" font-size="24" fill="#0f1e3d" letter-spacing="0">Branco</text><text x="1086" y="480" font-family="Helvetica Neue, Arial, sans-serif" font-size="20" fill="#0f1e3d" letter-spacing="0">#FFFFFF</text><text x="1086" y="513" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" fill="#0f1e3d" letter-spacing="0">RGB 255 · 255 · 255</text><text x="72" y="604" font-family="Helvetica Neue, Arial, sans-serif" font-size="24" fill="#0f1e3d" letter-spacing="0">Bases amplas em azul, carvão ou branco.</text><text x="72" y="642" font-family="Helvetica Neue, Arial, sans-serif" font-size="24" fill="#0f1e3d" letter-spacing="0">O amarelo marca a assinatura e pontos de atenção.</text><text x="72" y="680" font-family="Helvetica Neue, Arial, sans-serif" font-size="24" fill="#0f1e3d" letter-spacing="0">Cinza claro #F4F6FB e tinta clara #E9EDF6 apoiam a interface.</text><path d="M72 725H1368" stroke="#d8dfec" stroke-width="1"/><text x="72" y="774" font-family="Helvetica Neue, Arial, sans-serif" font-size="18" fill="#52627c" letter-spacing="0">Contraste calculado: azul/branco 16.5:1 · amarelo/carvão 8.7:1 · amarelo/branco 2.1:1.</text><text x="72" y="806" font-family="Helvetica Neue, Arial, sans-serif" font-size="17" fill="#52627c" letter-spacing="0">Em fundo branco, use azul para textos e controles pequenos; reserve o amarelo para a marca e acentos.</text><path d="M72 840H1368" stroke="#d8dfec" stroke-width="1"/><text x="72" y="872" font-family="Helvetica Neue, Arial, sans-serif" font-size="11" fill="#52627c" letter-spacing="1">PALETA E CONTRASTE</text><text x="1328" y="872" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" fill="#52627c" letter-spacing="0">06</text></svg>