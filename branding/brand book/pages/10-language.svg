</g><text x="72" y="682" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" fill="#d8ad4a" letter-spacing="2">MOLDURAS</text><text x="514" y="682" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" fill="#d8ad4a" letter-spacing="2">LINHAS</text><text x="956" y="682" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" fill="#d8ad4a" letter-spacing="2">CONTORNOS</text><text x="72" y="725.0" font-family="Helvetica Neue, Arial, sans-serif" font-size="21" fill="#e9edf6" letter-spacing="0">O oval acolhe uma mensagem.</text><text x="72" y="755.45" font-family="Helvetica Neue, Arial, sans-serif" font-size="21" fill="#e9edf6" letter-spacing="0">Um motivo por composição.</text><text x="514" y="725.0" font-family="Helvetica Neue, Arial, sans-serif" font-size="21" fill="#e9edf6" letter-spacing="0">Linhas organizam o conteúdo.</text><text x="514" y="755.45" font-family="Helvetica Neue, Arial, sans-serif" font-size="21" fill="#e9edf6" letter-spacing="0">O amarelo indica uma passagem.</text><text x="956" y="725.0" font-family="Helvetica Neue, Arial, sans-serif" font-size="21" fill="#e9edf6" letter-spacing="0">Ritmo derivado do selo.</text><text x="956" y="755.45" font-family="Helvetica Neue, Arial, sans-serif" font-size="21" fill="#e9edf6" letter-spacing="0">Usar com espaço e moderação.</text><path d="M72 840H1368" stroke="#2c3444" stroke-width="1"/><text x="72" y="872" font-family="Helvetica Neue, Arial, sans-serif" font-size="11" fill="#b8c1d2" letter-spacing="1">LINGUAGEM GRÁFICA</text><text x="1328" y="872" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" fill="#b8c1d2" letter-spacing="0">10</text></svg>