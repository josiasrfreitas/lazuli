# Cheap staged-only checks. Infrastructure and compilation belong to pre-push.

pre-commit:
  piped: true
  jobs:
    - name: format
      glob: "*.{js,cjs,mjs,ts,tsx,css,md,json,yaml,yml}"
      run: pnpm exec prettier --write --ignore-path .gitignore --ignore-path .prettierignore {staged_files}
      stage_fixed: true
    - name: staged-checks
      run: pnpm check:pre-commit

pre-push:
  commands:
    affected-checks:
      run: pnpm check:pre-push --base origin/main

post-checkout:
  commands:
    bootstrap-worktree:
      run: bash scripts/git-hooks/post-checkout-worktree.sh {1} {2} {3}
