<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" role="img" aria-labelledby="title">
  <title id="title">Picareta com o cabo quebrado</title>
  <defs>
    <linearGradient id="head" x1="17" y1="25" x2="111" y2="52" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F06A78" />
      <stop offset="1" stop-color="#A8324D" />
    </linearGradient>
    <linearGradient id="handle" x1="66" y1="47" x2="50" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D77659" />
      <stop offset="1" stop-color="#8F3B3E" />
    </linearGradient>
  </defs>

  <!-- Curved pickaxe head -->
  <path
    d="M10 39C25 29 43 23 58 25L65 28L72 27C87 29 104 38 118 52L114 59C98 47 84 40 70 37L57 37C43 34 29 37 14 45L10 39Z"
