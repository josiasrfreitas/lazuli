  <path
    d="M57 45L69 48L65 66L61 63L58 69L55 64L50 68L48 62L53 45L57 45Z"
    fill="url(#handle)"
    stroke="#111A3B"
    stroke-width="5"
    stroke-linejoin="round"
  />
  <path d="M61 49L57 60" stroke="#F39A7E" stroke-width="3" stroke-linecap="round" />

  <!-- Detached lower half of the handle -->
  <path
    d="M51 79L55 82L59 76L63 82L68 78L71 85L58 118C56 123 50 125 45 122C41 120 40 116 42 112L55 83L51 79Z"
    fill="url(#handle)"
    stroke="#111A3B"
    stroke-width="5"
    stroke-linejoin="round"
  />
  <path d="M62 88L51 116" stroke="#E9896D" stroke-width="3" stroke-linecap="round" />
</svg>
