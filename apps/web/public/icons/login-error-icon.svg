    stroke-linejoin="round"
  />
  <path d="M18 38C33 30 47 28 58 29" stroke="#FF919A" stroke-width="3" stroke-linecap="round" />

  <!-- Central socket -->
  <path
    d="M56 24L70 27L75 43L67 50L52 46L49 37L56 24Z"
    fill="#C74659"
    stroke="#111A3B"
    stroke-width="5"
    stroke-linejoin="round"
  />

