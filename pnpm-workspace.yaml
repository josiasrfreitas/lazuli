packages:
  - "apps/*"
  - "packages/*"
  - "tooling/*"

allowBuilds:
  "@prisma/engines": true
  core-js-pure: true
  esbuild: true
  lefthook: true
  prisma: true
  sharp: true
  unrs-resolver: true

# Single source of truth for shared dependency versions (pnpm catalog).
# Packages reference these via `catalog:`.
catalog:
  # Language / runtime
  typescript: ^7.0.2
  tsx: ^4.19.2
  "@types/node": ^22.10.5
  "@types/nodemailer": ^8.0.1

  # Web
  next: ^16.2.12
  react: ^19.2.8
  react-dom: ^19.2.8
  "@types/react": ^19.2.18
  "@types/react-dom": ^19.2.4
  storybook: ^10.5.5
  "@storybook/addon-docs": ^10.5.5
  "@storybook/nextjs": ^10.5.5
  "@tailwindcss/postcss": ^4.3.3
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  lucide-react: ^1.28.0
  postcss: ^8.5.25
  shadcn: ^4.16.1
  tailwind-merge: ^3.6.0
  tailwindcss: ^4.3.3
  tw-animate-css: ^1.4.0
  webpack: ^5.109.2

  # Shared libs
  "@prisma/adapter-pg": ^7.8.0
  "@prisma/client": ^7.8.0
  "@trpc/server": ^11.18.0
  "@types/pg": ^8.15.5
  better-auth: ^1.6.22
  dotenv: ^17.2.3
  dotenv-cli: ^11.0.0
  nodemailer: ^7.0.11
  pg: ^8.16.3
  prisma: ^7.8.0
  resend: ^6.16.0
  superjson: ^2.2.6
  zod: ^3.24.1

  # Tooling
  turbo: ^2.3.3
  prettier: ^3.4.2
  eslint: ^9.18.0
  typescript-eslint: ^8.65.0
  "@eslint/js": ^9.18.0
  eslint-import-resolver-typescript: ^4.4.5
  eslint-plugin-import: ^2.32.0
  eslint-plugin-security: ^4.0.1
  eslint-plugin-sonarjs: ^4.2.0
  eslint-plugin-unicorn: ^61.0.2
  eslint-plugin-unused-imports: ^4.4.1
  jscpd: ^5.0.11
  lefthook: ^1.13.4
